name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
      - name: Fail on high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            build_args: ""
          - name: frontend
            context: frontend
            build_args: --build-arg VITE_API_BASE_URL=https://container-scan.invalid/api/v1
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build ${{ matrix.build_args }} -t gympro-${{ matrix.name }}:scan ${{ matrix.context }}
      - name: Scan image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gympro-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
